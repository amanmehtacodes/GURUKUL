<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>report — gurukul</title>
    <meta name="robots" content="noindex, nofollow" />
    <script>
      // The site always renders in dark theme now — see the same comment in
      // classes.html's <head>.
      document.documentElement.setAttribute("data-theme", "dark");
    </script>

    <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/admin.css" />
    <link rel="stylesheet" href="css/report.css" />

    <!-- All deferred — none of these are needed until report.js's init()
     runs on DOMContentLoaded, so there's no reason to block first paint
     on them (see the fuller comment in classes.html's <head>). -->
    <script
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"
      defer
    ></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
      media="print"
      onload="this.media='all'"
    />
    <noscript
      ><link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
    /></noscript>
    <script
      src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"
      defer
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
      defer
    ></script>
  </head>
  <body>
    <div class="site-bg" id="siteBg" aria-hidden="true"></div>

    <header class="site-header">
      <a href="classes.html" class="brand">
        <img src="assets/logo.svg" alt="gurukul" class="brand-mark" />
      </a>
      <div class="header-right">
        <span class="admin-badge">Report</span>
      </div>
    </header>

    <main id="reportRoot" class="report-main">
      <div class="report-loading">Loading report…</div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/molten-metal.js"></script>
    <script>
      // Site-wide animated background — same on every page and every device.
      // Interior pages use a lower `detail` than the landing hero — see the
      // same comment in classes.html.
      MoltenMetal.mount(document.getElementById("siteBg"), { detail: 3 });
    </script>
    <script src="js/math.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/backend.js"></script>
    <script src="js/report-view.js"></script>
    <script src="js/report.js"></script>
  </body>
</html>
