<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gurukul — English Study Notes</title>
    <meta
      name="description"
      content="Minimal study site with unlocked notes and locked tests."
    />
    <script>
      // The site always renders in dark theme now — the animated background
      // is fixed regardless of theme and there's no toggle to switch out of
      // it anymore, so this just locks the attribute every theme-relative
      // CSS token still keys off (see :root[data-theme="dark"] in style.css).
      document.documentElement.setAttribute("data-theme", "dark");
    </script>

    <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/favicon-32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="assets/favicon-16.png"
    />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/report.css" />

    <!-- Markdown parser, PDF export, Supabase, and KaTeX are all only used
     after a user actually opens a note/test (or signs in) — never during
     first paint — so every one of them is `defer`red rather than a plain
     blocking <script>. Plain scripts here would each hold up the parser
     (and therefore the very first paint of the page) until downloaded and
     run; `defer` lets the browser keep parsing/rendering the rest of the
     document immediately and fetches these in the background, running
     them in order right before DOMContentLoaded — which is exactly when
     app.js's boot() (also gated on DOMContentLoaded) needs them ready. -->
    <!-- Markdown parser (bundled locally — no CDN dependency) -->
    <script src="js/vendor/marked.min.js" defer></script>
    <!-- PDF export (bundled locally — no CDN dependency) -->
    <script src="js/vendor/html2pdf.bundle.min.js" defer></script>
    <!-- Supabase client (auth + database) -->
    <script
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"
      defer
    ></script>
    <!-- KaTeX (notebook-style math rendering in notes, questions, answers).
     The stylesheet uses the print-media swap trick so it doesn't block
     first paint either — it only matters once a note with math renders,
     well after load. -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
      media="print"
      onload="this.media='all'"
    />
    <noscript
      ><link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
    /></noscript>
    <script
      src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"
      defer
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
      defer
    ></script>
  </head>
  <body>
    <div class="site-bg" id="siteBg" aria-hidden="true"></div>

    <header class="site-header">
      <div style="display: flex; align-items: center; gap: 14px">
        <button
          class="sidebar-toggle"
          id="sidebarToggle"
          aria-label="Toggle menu"
        >
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path
              d="M2 4h12M2 8h12M2 12h12"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
          </svg>
        </button>
        <a href="#" class="brand" id="brandLink">
          <img src="assets/logo.svg" alt="nav gurukul" class="brand-mark" />
        </a>
      </div>
      <div class="header-right">
        <div class="header-progress-link" id="progressLink"></div>
        <div class="auth-area" id="authArea"></div>
      </div>
    </header>

    <div id="pickerRoot"></div>
    <div id="yearRoot" class="hidden"></div>
    <div id="subjectRoot" class="hidden"></div>
    <div id="trackRoot" class="hidden"></div>
    <div id="progressRoot" class="hidden"></div>

    <div class="app-shell hidden">
      <nav class="sidebar" id="sidebar"></nav>
      <main class="main">
        <div class="content-wrap" id="mainContent"></div>
      </main>
    </div>

    <script src="data/curriculum.js"></script>
    <script src="js/config.js"></script>
    <script src="js/molten-metal.js"></script>
    <script>
      // Site-wide animated background — same on every page and every device
      // (see the .site-bg comment in style.css for the full-page-behind-
      // everything layering this relies on). Interior pages use a lower
      // `detail` than the landing page's hero (which stays at the component's
      // default of 6) — busier shader detail reads better full-bleed behind a
      // single hero than tiled behind readable page content everywhere else.
      MoltenMetal.mount(document.getElementById("siteBg"), { detail: 3 });
    </script>
    <script src="js/icons.js"></script>
    <script src="js/math.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/backend.js"></script>
    <script src="js/report-view.js"></script>
    <script src="js/access-control.js"></script>
    <script src="js/progress.js"></script>
    <script src="js/progress-page.js"></script>
    <script src="js/border-glow.js"></script>
    <script src="js/class-picker.js"></script>
    <script src="js/year-picker.js"></script>
    <script src="js/subject-picker.js"></script>
    <script src="js/track-picker.js"></script>
    <script src="js/coming-soon.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/topic-overview.js"></script>
    <script src="js/notes.js"></script>
    <script src="js/tests.js"></script>
    <script src="js/app.js"></script>
    <script>
      document
        .getElementById("brandLink")
        .addEventListener("click", function (e) {
          e.preventDefault();
          document.dispatchEvent(new CustomEvent("gurukul:home"));
        });
    </script>
  </body>
</html>
