<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gurukul — NCERT Study Notes</title>
<meta name="description" content="Clear, complete notes for every NCERT chapter — classes 8 to 12, JEE and NEET. Free to read.">

<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<!-- Supabase client (auth) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>

<section class="hero-landing" id="heroLanding">
  <div class="hero-badge"><span class="hero-badge-dot"></span>NCERT-Powered Study Notes</div>
  <img src="assets/logo.svg" alt="Gurukul" class="hero-logo">
  <p class="hero-desc">Clear, complete notes for every NCERT chapter — classes 8 to 12, JEE and NEET.<br>Free to read. Sign in only to unlock tests and track your progress.</p>
  <div class="hero-actions">
    <button class="hero-btn hero-btn-primary" id="heroReadBtn" type="button">Read Notes for Free</button>
    <button class="hero-btn hero-btn-ghost" id="heroLoginBtn" type="button">Login</button>
  </div>
</section>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
  Auth.init();

  document.getElementById("heroReadBtn").addEventListener("click", function () {
    window.location.href = "classes.html";
  });
  document.getElementById("heroLoginBtn").addEventListener("click", function () {
    Auth.promptSignIn("classes.html");
  });
</script>
</body>
</html>
